add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# The backend API can live on any host:8000 (see VITE_API_URL /
# window.location.hostname derivation in src/lib/api.ts), so connect-src
# allows that port on any host rather than a hardcoded origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://*:8000 https://*:8000; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
